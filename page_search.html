<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>问题多跳可视化</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>问题多跳可视化</h1>
            <p><a href="/">返回首页</a></p>
        </div>

        <div class="search-box">
            <input type="text" id="keyword" placeholder="请输入检索关键词">
            <button class="search-btn" onclick="searchQA()">开始检索</button>
        </div>
        
        <div id="status-tip" class="status-tip">当前：浏览示例数据（第 1 页）</div>

        <div id="results" class="result-list"></div>

        <div class="pagination">
            <button id="next-page-btn" class="next-btn" onclick="nextPage()">下一页</button>
        </div>

        <div id="modal">
            <div class="modal-content">
                <button class="close-btn" onclick="closeModal()">关闭</button>
                <div id="modalGraph" style="width: 100%; height: 600px;"></div>
            </div>
        </div>
    </div>

    <script src="/static/main.js"></script>
</body>
</html>
