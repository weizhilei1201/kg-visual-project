<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>全局知识图谱样本</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        .graph-card {
            width: 95%;
            height: 700px;
            margin: 20px auto;
            background: #f8faff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(22, 93, 255, 0.1);
            padding: 20px;
            transition: all 0.2s ease;
        }
        .graph-card:hover {
            transform: scale(1.01);
            box-shadow: 0 4px 12px rgba(22, 93, 255, 0.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>全局知识图谱样本</h1>
            <p><a href="./">返回首页</a></p>
        </div>

        <div class="graph-card" id="graphChart"></div>
    </div>

    <script>
        window.addEventListener('load', async function() {
            const chartDom = document.getElementById('graphChart');
            if (!chartDom) {
                console.error('找不到 graphChart 容器');
                return;
            }

            const myChart = echarts.init(chartDom);
            
            // 显示加载提示
            chartDom.innerHTML = '<div style="text-align:center; padding-top:300px;">正在加载数据...</div>';
            
            try {
                // 直接读取本地的 data.json
                const res = await fetch('data.json');
                const allData = await res.json();
                
                console.log('数据加载完成，共 ' + allData.length + ' 条');
                
                const nodes = new Map();
                const links = [];
                let tripleCount = 0;
                const MAX_TRIPLES = 150;  // 限制最多150条边，避免渲染过慢
                
                // 从数据中提取三元组
                for (let i = 0; i < allData.length && tripleCount < MAX_TRIPLES; i++) {
                    const steps = allData[i].evidences || [];
                    for (let j = 0; j < steps.length && tripleCount < MAX_TRIPLES; j++) {
                        const step = steps[j];
                        if (Array.isArray(step) && step.length >= 3) {
                            const sub = step[0];
                            const pred = step[1];
                            const obj = step[2];
                            
                            if (sub && obj) {
                                if (!nodes.has(sub)) nodes.set(sub, { name: sub });
                                if (!nodes.has(obj)) nodes.set(obj, { name: obj });
                                links.push({
                                    source: sub,
                                    target: obj,
                                    name: pred
                                });
                                tripleCount++;
                            }
                        }
                    }
                }
                
                console.log('渲染图谱：' + nodes.size + ' 个节点，' + links.length + ' 条边');
                
                // 如果没有任何数据，显示提示
                if (nodes.size === 0) {
                    chartDom.innerHTML = '<div style="text-align:center; padding-top:300px;">暂无图谱数据</div>';
                    return;
                }
                
                const option = {
                    title: {
                        text: '全局知识图谱样本 (显示前 ' + tripleCount + ' 条关系)',
                        left: 'center',
                        textStyle: { fontSize: 14 }
                    },
                    tooltip: {
                        trigger: 'item',
                        formatter: function(params) {
                            if (params.dataType === 'edge') {
                                return params.data.name;
                            }
                            return params.name;
                        }
                    },
                    series: [{
                        type: 'graph',
                        layout: 'force',
                        data: Array.from(nodes.values()),
                        links: links,
                        roam: true,
                        draggable: true,
                        label: {
                            show: true,
                            position: 'right',
                            fontSize: 12
                        },
                        edgeLabel: {
                            show: true,
                            fontSize: 10,
                            formatter: function(params) {
                                return params.data.name;
                            },
                            position: 'middle'
                        },
                        edgeSymbol: ['none', 'arrow'],
                        edgeSymbolSize: [0, 8],
                        force: {
                            repulsion: 300,
                            edgeLength: 120,
                            gravity: 0.1
                        },
                        lineStyle: {
                            curveness: 0.2,
                            width: 1.5
                        }
                    }]
                };
                
                myChart.setOption(option);
                
                // 窗口大小变化时重新调整
                window.addEventListener('resize', function() {
                    myChart.resize();
                });
                
            } catch (err) {
                console.error('加载失败:', err);
                chartDom.innerHTML = '<div style="text-align:center; padding-top:300px; color:red;">加载失败：' + err.message + '</div>';
            }
        });
    </script>
</body>
</html>
