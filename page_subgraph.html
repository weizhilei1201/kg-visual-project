<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>实体关联子图</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        .cluster-input select {
            padding: 8px 12px;
            font-size: 14px;
            min-width: 120px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .cluster-input button {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .cluster-input button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .entity-search-section .cluster-input {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .entity-search-section input {
            flex: 1;
            min-width: 300px;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        /* 热门实体推荐样式 */
        .hot-entities {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .hot-entity-tag {
            padding: 6px 12px;
            background-color: #f0f2f5;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            font-size: 13px;
            color: #333;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .hot-entity-tag:hover {
            background-color: #e5e7eb;
            border-color: #d1d5db;
        }
        /* 搜索结果卡片容器 */
        #entitySearchResult {
            margin-top: 15px;
            padding: 15px;
            background-color: #f9fafb;
            border-radius: 8px;
            min-height: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>实体检索与聚类</h1>
            <p><a href="/">返回首页</a></p>
        </div>

        <!-- 实体关联子图 -->
        <div class="cluster-box">
            <h3>实体N跳关联图谱</h3>
            <div class="cluster-input">
                <input type="text" id="clusterEntity" placeholder="输入实体名称">
                <select id="clusterDepth">
                    <option value="1">1跳关联</option>
                    <option value="2">2跳关联</option>
                </select>
                <select id="clusterLimit">
                    <option value="50">最多50条</option>
                    <option value="100">最多100条</option>
                    <option value="200">最多200条</option>
                </select>
                <button class="search-btn" onclick="showEntityCluster()">查询图谱</button>
                <button class="search-btn" style="background-color: #27AE60; transition: all 0.2s ease;" onclick="loadRandomDemoEntity()">换一个</button>
            </div>
            <div id="clusterGraph"></div>
        </div>

        <div class="cluster-box entity-search-section">
            <h3>实体名称检索</h3>
            <div class="cluster-input">
                <input type="text" id="entitySearchKeyword" placeholder="输入实体关键词">
                <button class="search-btn" onclick="searchEntity()">搜索实体</button>
            </div>

            <div class="hot-entities">
                <span style="font-size: 14px; color: #666; margin-right: 5px;">热门实体：</span>
                <span class="hot-entity-tag" onclick="document.getElementById('entitySearchKeyword').value='French'">French</span>
                <span class="hot-entity-tag" onclick="document.getElementById('entitySearchKeyword').value='American'">American</span>
                <span class="hot-entity-tag" onclick="document.getElementById('entitySearchKeyword').value='Hungarian'">Hungarian</span>
                <span class="hot-entity-tag" onclick="document.getElementById('entitySearchKeyword').value='comedy'">comedy</span>
                <span class="hot-entity-tag" onclick="document.getElementById('entitySearchKeyword').value='drama'">drama</span>
                <span class="hot-entity-tag" onclick="document.getElementById('entitySearchKeyword').value='1950'">1950</span>
            </div>

            <div id="entitySearchResult"></div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
