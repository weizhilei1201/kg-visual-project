<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>多跳问答系统 - 首页导航</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft Yahei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #eef7fa 0%, #f0f7fb 100%);
            min-height: 100vh;
        }
        .container {
            width: 100%;
            padding: 80px 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 80px;
        }
        .header h1 {
            color: #165DFF;
            font-size: 36px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .header p {
            color: #666;
            font-size: 16px;
        }
        .nav-box {
            max-width: 700px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 120px;
            background: #f8fbf9;
            text-decoration: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(22, 93, 255, 0.08);
            transition: all 0.25s ease;
            padding: 0 20px;
            text-align: center;
        }

        .nav-item:nth-child(1) {
            color: #27AE60;
        }
        .nav-item:nth-child(1):hover {
            background: #27AE60;
            color: #fff;
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 8px 20px rgba(39, 174, 96, 0.2);
        }
        .nav-item:nth-child(2) {
            color: #F39C12;
        }
        .nav-item:nth-child(2):hover {
            background: #F39C12;
            color: #fff;
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 8px 20px rgba(243, 156, 18, 0.2);
        }
        .nav-item:nth-child(3) {
            color: #165DFF;
        }
        .nav-item:nth-child(3):hover {
            background: #165DFF;
            color: #fff;
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 8px 20px rgba(22, 93, 255, 0.2);
        }
        .nav-item:nth-child(4) {
            color: #9B59B6;
        }
        .nav-item:nth-child(4):hover {
            background: #9B59B6;
            color: #fff;
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 8px 20px rgba(155, 89, 182, 0.2);
        }
        /* 适配小屏幕 */
        @media (max-width: 600px) {
            .nav-box {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 28px;
            }
            .nav-item {
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>多跳问答 & 知识图谱系统</h1>
            <p>请选择功能进入对应页面</p>
        </div>
        <div class="nav-box">
            <a href="/search" class="nav-item">
                1. 问题多跳推理可视化
            </a>
            <a href="/statistics" class="nav-item">
                2. 数据大屏展示
            </a>
            <a href="/subgraph" class="nav-item">
                3. 实体检索与聚类
            </a>
            <a href="/graph" class="nav-item">
                4. 全局知识图谱查看
            </a>
        </div>
    </div>
</body>
</html>
